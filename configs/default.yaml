seed: 42
openml_data_id: 1590
target_column: class
positive_label: ">50K"
test_size: 0.2
val_size: 0.2
models:
  majority: {}
  logistic:
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 200
    max_depth: 16
    min_samples_leaf: 4
    class_weight: balanced_subsample
    n_jobs: -1
  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.08
    max_depth: 8
    l2_regularization: 0.1
selection_metric: roc_auc
reports_dir: reports
